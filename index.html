<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Seoul Pomodoro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay"></div>
    <!-- 배경 영상이나 이미지를 넣을 공간 (서울 풍경용) -->
    <div class="container">
        <h1>뽀모도로 타이머</h1>
        <div id="timer">25:00</div>
        <div class="buttons">
            <button id="start">시작</button>
            <button id="reset">초기화</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
